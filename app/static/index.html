<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient Services · Assistant demo</title>
<style>
  :root{
    --paper:#f4f1ea; --card:#fffdf8; --ink:#1d2a28; --ink-soft:#5c6a67;
    --line:#e2dccd; --teal:#0e7570; --teal-ink:#0b5955; --teal-wash:#e3efed;
    --amber:#9a5b00; --amber-wash:#f7ecd9; --red:#a92f24; --red-wash:#f7e3e0;
    --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--serif);
       background-image:radial-gradient(var(--line) 0.65px,transparent 0.65px);background-size:22px 22px}
  .app{max-width:860px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:20px 20px 14px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
  header h1{font-size:23px;font-weight:600;letter-spacing:.2px}
  header h1 span{color:var(--teal)}
  header .sub{font-family:var(--mono);font-size:11px;color:var(--ink-soft);letter-spacing:.4px}
  .tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  select,button.minor{font-family:var(--mono);font-size:11.5px;color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer}
  select:focus,button.minor:focus,input:focus{outline:2px solid var(--teal);outline-offset:1px}
  button.minor:hover{border-color:var(--teal)}
  #chat{flex:1;overflow-y:auto;padding:22px 4px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
  .msg{max-width:76%;display:flex;flex-direction:column;gap:5px;animation:rise .18s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg.user{align-self:flex-end;align-items:flex-end}
  .msg.bot{align-self:flex-start;align-items:flex-start}
  .bubble{padding:11px 15px;border-radius:14px;font-size:15.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .msg.user .bubble{background:var(--teal);color:#fdfefc;border-bottom-right-radius:4px}
  .msg.bot .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;
    box-shadow:0 1px 0 rgba(29,42,40,.05)}
  .who{font-family:var(--mono);font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink-soft)}
  .trace{font-family:var(--mono);font-size:11px;background:var(--card);border:1px solid var(--line);
    border-radius:9px;overflow:hidden;max-width:100%}
  .trace>summary{list-style:none;cursor:pointer;padding:6px 10px;display:flex;gap:8px;align-items:center;color:var(--ink-soft)}
  .trace>summary::-webkit-details-marker{display:none}
  .trace>summary::before{content:"▸";transition:transform .15s;color:var(--teal)}
  .trace[open]>summary::before{transform:rotate(90deg)}
  .trace .body{padding:2px 10px 9px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:5px;color:#3d4a48}
  .chip{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;letter-spacing:.5px;font-weight:600}
  .st-IDLE{background:var(--teal-wash);color:var(--teal-ink)}
  .st-AWAITING_CONFIRMATION{background:var(--amber-wash);color:var(--amber)}
  .st-ESCALATED{background:var(--red-wash);color:var(--red)}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .act{background:#f6f3ea;border:1px solid var(--line);border-radius:6px;padding:1px 7px}
  .act.ok{border-color:#bcd9d5;background:var(--teal-wash);color:var(--teal-ink)}
  .act.bad{border-color:#e5c2bd;background:var(--red-wash);color:var(--red)}
  .pending-note{font-size:11px;color:var(--amber);background:var(--amber-wash);border:1px solid #e8d5b0;
    border-radius:8px;padding:6px 10px}
  .sysnote{align-self:center;font-family:var(--mono);font-size:11.5px;color:var(--red);
    background:var(--red-wash);border:1px solid #e5c2bd;border-radius:8px;padding:6px 12px;animation:rise .18s ease-out}
  .hello{align-self:center;text-align:center;color:var(--ink-soft);font-size:14.5px;max-width:520px;margin-top:6vh;display:flex;flex-direction:column;gap:14px}
  .hello b{color:var(--ink);font-size:17px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .chips button{font-family:var(--serif);font-size:13.5px;background:var(--card);border:1px solid var(--line);
    border-radius:20px;padding:7px 14px;cursor:pointer;color:var(--ink)}
  .chips button:hover{border-color:var(--teal);color:var(--teal-ink)}
  #typing{display:none;align-self:flex-start;gap:6px;align-items:center;background:var(--card);
    border:1px solid var(--line);border-radius:14px;border-bottom-left-radius:4px;padding:12px 16px}
  #typing i{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:blink 1.2s infinite}
  #typing i:nth-child(2){animation-delay:.2s}#typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  #typing span{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin-left:4px}
  form{display:flex;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
  input{flex:1;font-family:var(--serif);font-size:15.5px;background:var(--card);color:var(--ink);
    border:1px solid var(--line);border-radius:12px;padding:12px 15px}
  input::placeholder{color:#9aa5a2}
  form button{font-family:var(--mono);font-size:12.5px;letter-spacing:.6px;background:var(--ink);color:#fdfdfb;
    border:none;border-radius:12px;padding:0 22px;cursor:pointer}
  form button:disabled{opacity:.45;cursor:default}
  form button:not(:disabled):hover{background:var(--teal-ink)}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Patient <span>Services</span></h1>
    <div class="sub">assistant demo · POST /assistant/message</div>
    <div class="tools">
      <select id="patient" title="Mock patient (bearer token)">
        <option value="token-p1001">P-1001</option>
        <option value="token-p1002">P-1002</option>
      </select>
      <select id="fault" title="Fault injection (ignored in production)">
        <option value="">no fault</option>
        <option>reschedule_silent_noop</option>
        <option>malformed_result</option>
        <option>tool_timeout</option>
        <option>tool_error</option>
        <option>slots_empty</option>
      </select>
      <button class="minor" id="reset" title="Start a new conversation">new chat</button>
    </div>
  </header>

  <div id="chat">
    <div class="hello" id="hello">
      <div><b>Good day.</b><br>Ask about appointments, availability, preparation or insurance —
      or book, move and cancel visits. Every appointment change is proposed first and only
      executed after you confirm it in a later message.</div>
      <div class="chips">
        <button>Book me a dental appointment on 13 October in the morning</button>
        <button>What appointments do I have?</button>
        <button>How should I prepare for my MRI scan?</button>
        <button>أريد إلغاء موعد القلب</button>
      </div>
    </div>
  </div>
  <div id="typing"><i></i><i></i><i></i><span>assistant is thinking…</span></div>

  <form id="composer">
    <input id="input" autocomplete="off" placeholder="Write a message… (e.g. “yes” to confirm a pending change)">
    <button id="send">SEND</button>
  </form>
</div>

<script>
const $ = id => document.getElementById(id);
const chat = $("chat"), form = $("composer"), input = $("input"), send = $("send");
let conversationId = null, busy = false;

const scroll = () => chat.scrollTop = chat.scrollHeight;

function addUser(text){
  const m = document.createElement("div"); m.className = "msg user";
  const b = document.createElement("div"); b.className = "bubble"; b.dir = "auto"; b.textContent = text;
  const w = document.createElement("div"); w.className = "who"; w.textContent = "patient";
  m.append(b, w); chat.appendChild(m); scroll();
}

function sysNote(text, tone){
  const n = document.createElement("div"); n.className = "sysnote"; n.textContent = text;
  if (tone) n.style.color = tone;
  chat.appendChild(n); scroll();
}

function addBot(d){
  const m = document.createElement("div"); m.className = "msg bot";
  const b = document.createElement("div"); b.className = "bubble"; b.dir = "auto"; b.textContent = d.message;
  const w = document.createElement("div"); w.className = "who"; w.textContent = "assistant";
  m.append(b, w);

  if (d.pending_confirmation){
    const p = document.createElement("div"); p.className = "pending-note";
    p.dir = "auto";
    p.textContent = "awaiting your confirmation — reply “yes” to execute or “no” to cancel · expires " +
      d.pending_confirmation.expires_at.slice(11, 16);
    m.appendChild(p);
  }
  if (d.escalation_id) sysNote("escalated to a human agent · " + d.escalation_id, "var(--amber)");

  const t = document.createElement("details"); t.className = "trace";
  const s = document.createElement("summary");
  s.appendChild(stateChip(d.state));
  s.appendChild(document.createTextNode(" system trace"));
  const body = document.createElement("div"); body.className = "body";

  const acts = document.createElement("div"); acts.className = "row";
  if (!d.actions.length) acts.append(muted("no tool actions"));
  for (const a of d.actions){
    const el = document.createElement("span");
    const good = a.status === "executed_verified" || a.status === "executed";
    const bad = a.status === "denied" || a.status === "failed";
    el.className = "act" + (good ? " ok" : bad ? " bad" : "");
    el.textContent = a.tool + " · " + a.status + (a.reason ? " · " + a.reason : "");
    acts.appendChild(el);
  }
  body.appendChild(label("actions", acts));

  if (d.failure){
    const f = document.createElement("div"); f.className = "row";
    const c = document.createElement("span"); c.className = "chip st-ESCALATED"; c.textContent = d.failure.code;
    f.appendChild(c); body.appendChild(label("failure", f));
  }
  if (d.sources.length){
    const src = document.createElement("div"); src.className = "row";
    for (const x of d.sources){ const e = muted(x.doc_id); src.appendChild(e); }
    body.appendChild(label("retrieved from", src));
  }
  const meta = document.createElement("div"); meta.className = "row";
  meta.append(muted("turn " + (d.request_id || "").slice(-6)));
  body.appendChild(label("trace", meta));
  t.append(s, body); m.appendChild(t); chat.appendChild(m); scroll();
}

function stateChip(st){
  const c = document.createElement("span"); c.className = "chip st-" + st; c.textContent = st; return c;
}
function label(text, el){
  const w = document.createElement("div"); w.className = "row";
  const l = document.createElement("span"); l.style.cssText = "min-width:118px;color:var(--ink-soft)";
  l.textContent = text; w.append(l, el); return w;
}
function muted(t){ const s = document.createElement("span"); s.textContent = t; return s; }

async function send_(text){
  if (busy || !text) return;
  busy = true; send.disabled = true; input.value = "";
  if ($("hello")) $("hello").remove();
  addUser(text); $("typing").style.display = "flex"; scroll();
  const headers = {"Content-Type": "application/json", "Authorization": "Bearer " + $("patient").value};
  if ($("fault").value) headers["X-Mock-Fault"] = $("fault").value;
  try{
    const res = await fetch("/assistant/message", {method: "POST", headers,
      body: JSON.stringify({message: text, conversation_id: conversationId})});
    const body = await res.json();
    if (!res.ok){ sysNote(res.status + " · " + (body.detail || "request rejected")); return; }
    conversationId = body.conversation_id;
    addBot(body);
  }catch(e){
    sysNote("network error — is the service running?");
  }finally{
    $("typing").style.display = "none"; busy = false; send.disabled = false; input.focus();
  }
}

form.addEventListener("submit", e => { e.preventDefault(); send_(input.value.trim()); });
$("patient").addEventListener("change", () => { conversationId = null; sysNote("switched patient — new conversation"); });
$("reset").addEventListener("click", () => { conversationId = null; sysNote("new conversation"); });
document.querySelectorAll(".chips button").forEach(b =>
  b.addEventListener("click", () => send_(b.textContent)));
</script>
</body>
</html>
